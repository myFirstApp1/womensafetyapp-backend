
services:
  # ---------- Infrastructure ----------

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      #- ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  

  redpanda:
    image: redpandadata/redpanda:v23.3.3
    container_name: redpanda
    command:
      - redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false --kafka-addr PLAINTEXT://0.0.0.0:9093 --advertise-kafka-addr PLAINTEXT://redpanda:9093
    ports:
      - "9093:9093"
      - "9644:9644"
    networks:
      - app-net
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    user: "0"
    volumes:
      - ./infra/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    tmpfs:
      - /loki:exec,mode=777     # ✅ Windows-safe in-memory storage
    networks:
      - app-net
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - app-net
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    depends_on:
      - loki
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - ./logs:/app/logs
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - app-net

  # ---------- Microservices ----------

  auth-service:
    build: ./womensafetyAuthservice/auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql-db:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: user
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9093
      KAFKA_CONSUMER_GROUP: auth-service-group
      USER_CREATED_TOPIC: user.identity
      USER_VERIFIED_TOPIC: user.verified
      EMAIL_VERIFICATION_TOPIC: send.email.verification
      EMAIL_PASSWORD_RESET_TOPIC: send.email.password-reset
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: "3600000"
      OTP_CODE_LENGTH: "6"
      OTP_TTL_MINUTES: "10"
      OTP_MAX_ATTEMPTS: "5"
      OTP_DEV_RETURN_CODE: "true"
      OUTBOX_POLL_MS: "2000"
      OUTBOX_BATCH_SIZE: "50"
    volumes:
      - ./logs/auth-service:/app/logs
    depends_on:
      mysql-db:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks:
      - app-net

  user-service:
    build: ./userservice/user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: user
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9093
      SPRING_PROFILES_ACTIVE: docker
      USER_CREATED_TOPIC: user.identity
      USER_VERIFIED_TOPIC: user.verified
      FIREBASE_ENABLED: "false"
      KAFKA_CONSUMER_GROUP: user-service
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: "3600000"
      LOGGING_FILE_NAME: /app/logs/user-service.log
    volumes:
      - ./logs/user-service:/app/logs
    depends_on:
      mysql-db:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks:
      - app-net

  notification-service:
    build: ./notificationservice/notification-service
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9093
      KAFKA_CONSUMER_GROUP: notification-service-group
      KAFKA_AUTO_OFFSET_RESET: earliest
      KAFKA_ACK_MODE: record
      KAFKA_CONCURRENCY: 3
      KAFKA_MAX_POLL_RECORDS: 10
      EMAIL_PASSWORD_RESET_TOPIC: send.email.password-reset
      APP_EMAIL_MOCK: "true"
      NOTIFICATION_MODE: mock
    volumes:
      - ./logs/notification-service:/app/logs/notification-service  
    depends_on:
      redpanda:
        condition: service_started
    networks:
      - app-net

  sos-service:
    build: ./sosservice/sos-service
    container_name: sos-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql-db:3306/sosdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: user
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9093
      USER_SERVICE_BASE_URL: http://user-service:8082/api/users/contacts
    volumes:
      - ./logs/sos-service:/app/logs/sos-service  
    depends_on:
      mysql-db:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks:
      - app-net

# ---------- PERSISTENT STORAGE ----------
volumes:
  mysql_data:
  
# ---------- Network (must be last) ----------
networks:
  app-net:
    driver: bridge
