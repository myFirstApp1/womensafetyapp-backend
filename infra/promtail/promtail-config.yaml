server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push       # ✅ Uses service name 'loki' inside Docker

scrape_configs:
  - job_name: auth-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth-service
          __path__: /app/logs/auth-service/*.log

  - job_name: user-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: user-service
          __path__: /app/logs/user-service/*.log

  - job_name: sos-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: sos-service
          __path__: /app/logs/sos-service/*.log

  - job_name: notification-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: notification-service
          __path__: /app/logs/notification-service/*.log                
