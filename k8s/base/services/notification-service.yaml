apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: womensafety

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: womensafetyapp-backend-notification-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8083
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: womensafety-config
                  key: SPRING_PROFILES_ACTIVE

            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: womensafety-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            - name: KAFKA_CONSUMER_GROUP
              value: "notification-service-group"

            - name: KAFKA_AUTO_OFFSET_RESET
              value: "earliest"

            - name: KAFKA_ACK_MODE
              value: "record"

            - name: KAFKA_CONCURRENCY
              value: "3"

            - name: KAFKA_MAX_POLL_RECORDS
              value: "10"

            - name: EMAIL_PASSWORD_RESET_TOPIC
              value: "send.email.password-reset"

            - name: APP_EMAIL_MOCK
              value: "true"

            - name: NOTIFICATION_MODE
              value: "mock"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: womensafety

spec:
  selector:
    app: notification-service

  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP

  type: ClusterIP