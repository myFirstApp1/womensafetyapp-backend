apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: womensafety
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: womensafetyapp-backend-user-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: womensafety-config
                  key: SPRING_PROFILES_ACTIVE

            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: womensafety-config
                  key: USER_DB_URL

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: womensafety-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: womensafety-secrets
                  key: DB_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: womensafety-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            - name: USER_CREATED_TOPIC
              value: "user.identity"

            - name: USER_VERIFIED_TOPIC
              value: "user.verified"

            - name: FIREBASE_ENABLED
              value: "false"

            - name: KAFKA_CONSUMER_GROUP
              value: "user-service"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: womensafety-secrets
                  key: JWT_SECRET

            - name: JWT_EXPIRATION
              value: "3600000"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: womensafety
spec:
  selector:
    app: user-service

  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP

  type: ClusterIP