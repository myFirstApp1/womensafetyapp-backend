spring.application.name=notification-service
spring.profiles.active=default
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
app.email.password-reset.topic=send.email.password-reset

spring.kafka.bootstrap-servers=redpanda:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
#spring.kafka.consumer.properties.spring.json.trusted.packages=com.womensafety.notificationservice.events

# Trusted packages
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tl.womensafety.common.*,java.util,java.time
spring.kafka.consumer.properties.spring.json.type.mapping=\
    EmailVerificationEvent:com.tl.womensafety.common.events.EmailVerificationEvent,\
NotificationRequest:com.tl.womensafety.common.dto.NotificationRequest,\
PasswordResetEvent:com.tl.womensafety.common.events.PasswordResetEvent

# Server
server.port=8083





#spring.config.import=optional:classpath:application-twilio.properties

