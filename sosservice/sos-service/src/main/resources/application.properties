spring.application.name=sos-service

# =========================================================
# SERVER
# =========================================================
server.port=${SERVER_PORT:8084}
server.address=0.0.0.0

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3310/sosdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# FLYWAY
# =========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================================================
# KAFKA
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.trusted.packages=com.tl.womensafety.common.*,java.util,java.time

# =========================================================
# USER SERVICE
# =========================================================
user.service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8082/api/users/contacts}

# =========================================================
# HEARTBEAT
# =========================================================
app.heartbeat.timeout-seconds=${HEARTBEAT_TIMEOUT_SECONDS:300}
app.heartbeat.check-interval-seconds=${HEARTBEAT_CHECK_INTERVAL_SECONDS:30}

# =========================================================
# SAFETY ENGINE
# =========================================================
safety.hr.max=${SAFETY_HR_MAX:140}
safety.hr.min=${SAFETY_HR_MIN:40}
safety.movement.danger=${SAFETY_MOVEMENT_DANGER:80}

# =========================================================
# AI - V2 / DISABLED FOR V1
# =========================================================
ai.protection.enabled=false
ai.minimum-confidence=80

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always