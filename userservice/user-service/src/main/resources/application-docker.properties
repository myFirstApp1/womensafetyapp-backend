spring.config.activate.on-profile=docker

# =========================================================
# SERVER
# =========================================================
server.port=${SERVER_PORT:8082}

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-db:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}

# =========================================================
# KAFKA
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:redpanda:9093}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:user-service}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.tl.womensafety.common.*,java.util,java.time

# =========================================================
# TOPICS
# =========================================================
app.user.created.topic=${USER_CREATED_TOPIC:user.identity}
app.user.verified.topic=${USER_VERIFIED_TOPIC:user.verified}

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# =========================================================
# FIREBASE
# =========================================================
firebase.enabled=${FIREBASE_ENABLED:false}

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always