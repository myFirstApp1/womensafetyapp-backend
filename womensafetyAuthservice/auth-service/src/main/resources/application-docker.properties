spring.kafka.bootstrap-servers=redpanda:9093
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=auth-service-group

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.admin.auto-create=true

#spring.flyway.out-of-order=true
app.email.topic=send.email.verification
app.email.password-reset.topic=send.email.password-reset
app.user.created.topic=user.identity
app.user.verified.topic=user.verified

# Kafka producer retry & safety
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.retry.backoff.ms=1000

spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=5
