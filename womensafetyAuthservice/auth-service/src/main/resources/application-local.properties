server.port=8081
#spring.datasource.url=jdbc:mysql://127.0.0.1:3307/womendb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=password@123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.url=jdbc:mysql://mysql-db:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=password
#spring.kafka.bootstrap-servers=host.docker.internal:9092
# optional but nice to have:
spring.kafka.properties.security.protocol=PLAINTEXT
spring.kafka.producer.acks=all
spring.kafka.consumer.auto-offset-reset=earliest
#spring.kafka.bootstrap-servers=localhost:9092
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


app.verification.topic=user.identity
#spring.flyway.enabled=false

# IMPORTANT: no file path locally
logging.file.name=
logging.level.root=INFO

management.endpoints.web.exposure.include=health,info
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO

app.email.password-reset.topic=send.email.password-reset