spring.application.name=auth-service

# =========================================================
# SERVER
# =========================================================
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3310/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# =========================================================
# FLYWAY
# =========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# =========================================================
# KAFKA
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.retry.backoff.ms=1000

spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=5

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:auth-service-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

# =========================================================
# APPLICATION TOPICS
# =========================================================
app.user.created.topic=${USER_CREATED_TOPIC:user.identity}
app.user.verified.topic=${USER_VERIFIED_TOPIC:user.verified}

app.email.topic=${EMAIL_VERIFICATION_TOPIC:send.email.verification}
app.email.password-reset.topic=${EMAIL_PASSWORD_RESET_TOPIC:send.email.password-reset}

# =========================================================
# OTP
# =========================================================
app.otp.code-length=${OTP_CODE_LENGTH:6}
app.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

# Development only
app.otp.dev-return-code=${OTP_DEV_RETURN_CODE:false}

# =========================================================
# OUTBOX
# =========================================================
app.outbox.poll-ms=${OUTBOX_POLL_MS:2000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================================================
# LOGGING
# =========================================================
logging.level.root=INFO
logging.level.com.womensafety.authservice=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN